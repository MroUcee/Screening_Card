<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f4ef">
  <meta name="description" content="上传剧照，填写影片信息，导出电影放映前使用的观影提醒。">
  <title>映前提示卡</title>
  <style>
:root {
  color-scheme: light;
  --ink: #25241f;
  --muted: #67645c;
  --paper: #f5f4ef;
  --line: #d8d5cb;
  --focus: #6a5d44;
  font: 16px/1.55 Inter, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: wait; opacity: .6; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
h1, h2, p { margin: 0; }
.workspace { max-width: 1500px; padding: 44px clamp(20px, 4.25vw, 68px) 22px; margin: 0 auto; }
.intro { padding-bottom: 19px; margin-bottom: 24px; border-bottom: 1px solid var(--line); }
.intro h1 { font-size: clamp(1.75rem, 3vw, 2.55rem); line-height: 1.2; font-weight: 710; }
.editor { display: grid; grid-template-columns: minmax(235px, 285px) minmax(0, 1fr); gap: clamp(23px, 3vw, 45px); align-items: start; }
.editor h2 { font-size: 1rem; line-height: 1.45; font-weight: 700; }
.field-pair { margin-top: 16px; display: grid; gap: 13px; }
.field, .field-label { font-size: .875rem; font-weight: 600; }
.field { display: grid; gap: 5px; }
.field input, .field textarea {
  width: 100%;
  min-width: 0;
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 9px 10px;
  font-size: 1rem;
  font-weight: 400;
  color: var(--ink);
  background: #fffefb;
}
.field input::placeholder { color: var(--muted); opacity: 1; }
.field textarea { resize: vertical; min-height: 6.5em; }
.image-section { margin-top: 15px; }
.drop-zone {
  display: block;
  width: 100%;
  text-align: left;
  background: transparent;
  border: 1px dashed #aaa598;
  color: inherit;
  padding: 11px 12px;
  border-radius: 4px;
  margin-top: 5px;
}
.drop-zone:hover, .drop-zone.is-dragging { border-color: var(--ink); background: #ebe8df; }
.drop-title, .drop-note { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.drop-title { font-size: .875rem; font-weight: 600; }
.drop-note { color: var(--muted); font-size: .8rem; margin-top: 2px; }
.image-settings { margin-top: 15px; display: grid; grid-template-columns: auto minmax(45px, 1fr) 4ch; gap: 8px; align-items: center; font-size: .875rem; }
.image-settings output { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
.image-settings input { width: 100%; margin: 0; accent-color: #4b483f; }
.error { margin-top: 7px; color: #8c3227; font-size: .875rem; }
.rules-settings { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 12px; }
.rules-settings summary { cursor: pointer; width: fit-content; font-size: .875rem; font-weight: 600; }
.rules-settings summary::marker { color: var(--muted); }
.rule-controls { display: grid; gap: 7px; margin-top: 10px; }
.rule-controls .plain-button { justify-self: start; margin-left: -7px; }
.color-controls { display: grid; gap: 7px; margin-top: 11px; }
.color-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: .875rem; }
.color-actions { display: flex; gap: 4px; align-items: center; }
.color-actions .plain-button { min-width: 30px; min-height: 31px; padding: 3px 6px; }
.color-actions [aria-pressed="true"] { background: #ebe8df; border-color: var(--line); }
.color-actions input[type="color"] { width: 37px; height: 31px; border: 1px solid var(--line); border-radius: 4px; background: #fffefb; padding: 3px; cursor: pointer; }
.preview-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.preview-label { font-size: .8125rem; color: var(--muted); }
.screen { overflow: hidden; background: #10100e; aspect-ratio: 16/9; }
canvas { display: block; width: 100%; height: auto; }
.preview-tools { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 44px; padding-top: 2px; }
.format-note { color: var(--muted); font-size: .875rem; font-variant-numeric: tabular-nums; }
.format-note > span[aria-hidden] { margin: 0 4px; }
.plain-button { border: 1px solid transparent; border-radius: 4px; background: transparent; color: inherit; padding: 5px 7px; font-size: .875rem; font-weight: 600; }
.plain-button:hover { background: #ebe8df; }
.export-bar { display: flex; justify-content: flex-end; align-items: stretch; gap: 8px; padding-top: 10px; border-top: 1px solid var(--line); }
.select-field { display: inline-flex; position: relative; min-width: 93px; }
.select-field select { width: 100%; background: #fffefb; color: inherit; appearance: none; padding: 7px 24px 7px 9px; border-radius: 4px; border: 1px solid var(--line); font-size: .875rem; }
.select-field .chevron { position: absolute; right: 10px; top: 14px; width: 7px; height: 7px; border: solid currentColor; border-width: 0 1.5px 1.5px 0; transform: rotate(45deg); pointer-events: none; }
.export-button { padding: 7px 16px; border: 1px solid #25241f; border-radius: 4px; background: #25241f; color: #fffefb; font-size: .9375rem; font-weight: 600; }
.export-button:hover { background: #403c32; }
.status { color: var(--muted); font-size: .875rem; text-align: right; }
.status:not(:empty) { margin-top: 8px; }
.privacy-note { color: var(--muted); font-size: .8125rem; margin-top: 18px; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
dialog { background: #0b0b0a; color: white; border: 0; padding: 0; width: 100%; height: 100%; max-width: none; max-height: none; }
dialog::backdrop { background: #0b0b0a; }
.dialog-body { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
.dialog-body canvas { width: min(100vw, calc(100dvh * 16 / 9)); }
.dialog-close { position: absolute; top: 8px; right: 12px; background: #1f1e1b; color: #fff; border-radius: 4px; border: 1px solid #5b574c; padding: 5px 10px; z-index: 1; }
@media (max-width: 950px) {
  .workspace { padding-top: 30px; }
  .editor { grid-template-columns: minmax(205px, .42fr) minmax(0, 1fr); }
}
@media (max-width: 680px) {
  .workspace { padding-top: 24px; }
  .intro { padding-bottom: 13px; margin-bottom: 18px; }
  .editor { grid-template-columns: minmax(0, 1fr); }
  .field-pair { grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
}
@media (max-width: 360px) {
  .field-pair { grid-template-columns: minmax(0, 1fr); }
}
</style>
</head>
<body>
  <main class="workspace">
    <header class="intro">
      <h1>映前提示卡</h1>
    </header>
    <div class="editor">
      <section class="controls" aria-labelledby="form-title">
        <h2 id="form-title">影片信息</h2>
        <div class="field-pair">
          <label class="field">片名
            <input id="film-title" type="text" maxlength="32" placeholder="输入片名（选填）" autocomplete="off">
          </label>
          <label class="field">导演
            <input id="film-director" type="text" maxlength="40" placeholder="输入导演姓名（选填）" autocomplete="off">
          </label>
        </div>
        <div class="image-section">
          <div class="field-label" id="image-label">剧照</div>
          <button type="button" class="drop-zone" id="drop-zone" aria-labelledby="image-label upload-label">
            <span>
              <span class="drop-title" id="upload-label">选择图片或拖放到这里</span>
              <span class="drop-note" id="file-caption">JPG、PNG 或 WebP</span>
            </span>
          </button>
          <input id="image-file" type="file" accept="image/jpeg,image/png,image/webp" hidden>
          <div class="image-settings">
            <label for="image-light">剧照亮度</label>
            <input type="range" id="image-light" min="20" max="100" step="1" value="100">
            <output id="light-value" for="image-light">100%</output>
          </div>
          <p class="error" id="image-error" role="alert" hidden></p>
        </div>
        <details class="rules-settings">
          <summary>编辑提醒文字</summary>
          <div class="rule-controls">
            <label class="field">中文提醒
              <textarea id="etiquette-text" rows="4" maxlength="120">请将手机调至静音并关闭振动
如需使用手机，请调低屏幕亮度
请保持安静，避免交谈和其他声响</textarea>
            </label>
            <label class="field">英文提醒
              <textarea id="etiquette-english" lang="en" rows="5" maxlength="320">Please silence your phone and turn off vibration.
If you need to use your phone, dim the screen.
Please keep quiet and avoid talking during the screening.</textarea>
            </label>
            <button type="button" class="plain-button" id="restore-rules">恢复默认文案</button>
          </div>
        </details>
        <details class="rules-settings">
          <summary>调整颜色</summary>
          <div class="color-controls">
            <div class="color-row">
              <label for="etiquette-color">观影提醒</label>
              <div class="color-actions">
                <button type="button" class="plain-button" data-color="#fbf9f3" aria-label="观影提醒用白色" aria-pressed="true">白</button>
                <button type="button" class="plain-button" data-color="#000000" aria-label="观影提醒用黑色" aria-pressed="false">黑</button>
                <input id="etiquette-color" type="color" value="#fbf9f3" aria-label="自选观影提醒颜色">
              </div>
            </div>
            <div class="color-row">
              <label for="film-color">影片信息</label>
              <div class="color-actions">
                <button type="button" class="plain-button" data-color="#fbf9f3" aria-label="影片信息用白色" aria-pressed="true">白</button>
                <button type="button" class="plain-button" data-color="#000000" aria-label="影片信息用黑色" aria-pressed="false">黑</button>
                <input id="film-color" type="color" value="#fbf9f3" aria-label="自选影片信息颜色">
              </div>
            </div>
            <div class="color-row">
              <label for="club-color">社团 Logo</label>
              <div class="color-actions">
                <button type="button" class="plain-button" data-color="#fbf9f3" aria-label="社团 Logo 用白色" aria-pressed="true">白</button>
                <button type="button" class="plain-button" data-color="#000000" aria-label="社团 Logo 用黑色" aria-pressed="false">黑</button>
                <input id="club-color" type="color" value="#fbf9f3" aria-label="自选社团 Logo 颜色">
              </div>
            </div>
          </div>
        </details>
      </section>
      <section class="preview-panel" aria-labelledby="preview-title">
        <div class="preview-heading">
          <h2 id="preview-title">投影预览</h2>
          <span id="preview-label" class="preview-label">默认剧照《不散》</span>
        </div>
        <div class="screen" id="screen">
          <canvas id="card" width="1920" height="1080" role="img" aria-label="放映提示卡实时预览">当前浏览器不支持预览，请换用新版浏览器。</canvas>
        </div>
        <div class="preview-tools">
          <span class="format-note">16:9 <span aria-hidden="true">·</span> <span id="format-size">1920 × 1080</span></span>
          <button type="button" class="plain-button fullscreen" id="fullscreen">全屏预览</button>
        </div>
        <div class="export-bar">
          <label class="select-field">
            <span class="visually-hidden">导出分辨率</span>
            <select id="resolution">
              <option value="1">1080p</option>
              <option value="2">4K</option>
            </select>
            <span class="chevron" aria-hidden="true"></span>
          </label>
          <button type="button" class="export-button" id="download" disabled>下载 PNG</button>
        </div>
        <p class="status" id="status" role="status"></p>
      </section>
    </div>
    <p class="privacy-note">图片在你的浏览器中处理。</p>
  </main>
  <dialog id="preview-dialog" aria-label="全屏投影预览">
    <div class="dialog-body">
      <button type="button" class="dialog-close" id="close-preview">关闭预览</button>
      <canvas id="large-card" width="1920" height="1080" role="img" aria-label="放映提示卡"></canvas>
    </div>
  </dialog>
<script>
"use strict";

const width = 1920;
const height = 1080;
const fonts = '"Songti SC", "Noto Serif CJK SC", "Noto Serif SC", SimSun, serif';
const reminderHeading = "映前提醒";
const get = (id) => document.getElementById(id);
const card = get("card");
const titleInput = get("film-title");
const directorInput = get("film-director");
const reminderInput = get("etiquette-text");
const englishInput = get("etiquette-english");
const reminderColor = get("etiquette-color");
const filmColor = get("film-color");
const clubColor = get("club-color");
const lightInput = get("image-light");
const fileInput = get("image-file");
const dropZone = get("drop-zone");
const resolutionInput = get("resolution");
const downloadButton = get("download");
const dialog = get("preview-dialog");
const tintedLogo = document.createElement("canvas");

let selectedImage = null;
let sampleImage = null;
let clubLogo = null;
let clubQr = null;
let fileRequest = 0;

function setFont(ctx, size, weight) {
  ctx.font = weight + " " + size + "px " + fonts;
}

function lettering(ctx, text, x, y, size, weight = 400) {
  setFont(ctx, size, weight);
  ctx.fillText(text, x, y);
}

function wrapText(ctx, text, maxWidth) {
  const lines = [];
  let line = "";
  for (const character of text) {
    if (line && ctx.measureText(line + character).width > maxWidth) {
      lines.push(line.trimEnd());
      line = character.trimStart();
    } else {
      line += character;
    }
  }
  if (line) lines.push(line.trimEnd());
  return lines;
}

function wrapEnglish(ctx, text, maxWidth) {
  const lines = [];
  let line = "";
  for (const word of text.split(/\s+/)) {
    const joined = line ? line + " " + word : word;
    if (ctx.measureText(joined).width <= maxWidth) {
      line = joined;
      continue;
    }
    if (line) lines.push(line);
    const chunks = wrapText(ctx, word, maxWidth);
    line = chunks.pop() || "";
    lines.push(...chunks);
  }
  if (line) lines.push(line);
  return lines;
}

function fitText(ctx, text, maxWidth, maxLines, startSize, minSize, weight) {
  for (let size = startSize; size >= minSize; size -= 2) {
    setFont(ctx, size, weight);
    const lines = wrapText(ctx, text, maxWidth);
    if (lines.length <= maxLines) return { size, lines };
  }
  setFont(ctx, minSize, weight);
  return { size: minSize, lines: wrapText(ctx, text, maxWidth) };
}

function drawStill(ctx, source) {
  ctx.fillStyle = "#10100e";
  ctx.fillRect(0, 0, width, height);
  if (!source) return;

  const scale = Math.max(width / source.naturalWidth, height / source.naturalHeight);
  const w = source.naturalWidth * scale;
  const h = source.naturalHeight * scale;
  ctx.drawImage(source, (width - w) / 2, (height - h) / 2, w, h);
  const dim = 1 - Number(lightInput.value) / 100;
  if (dim > 0) {
    ctx.fillStyle = "rgba(0, 0, 0, " + dim + ")";
    ctx.fillRect(0, 0, width, height);
  }
}

function drawFilmInfo(ctx, title, director) {
  const left = 96;
  let nextY = 105;
  ctx.textAlign = "left";
  if (title) {
    lettering(ctx, "今日放映", left, nextY, 29);
    const { size, lines } = fitText(ctx, title, 1180, 2, 74, 46, 700);
    nextY += 54;
    for (const line of lines) {
      lettering(ctx, line, left, nextY, size, 700);
      nextY += size * 1.13;
    }
    nextY -= size * .28;
  }
  if (director) {
    const { size, lines } = fitText(ctx, "导演  " + director, 1160, 2, 36, 26, 400);
    lines.forEach((line, index) => lettering(ctx, line, left, nextY + index * size * 1.3, size));
  }
}

function fitReminder(ctx, paragraphs, { maxWidth, maxHeight, startSize, minSize, wrap }) {
  const leading = 1.34;
  for (let size = startSize; size >= minSize; size -= 2) {
    setFont(ctx, size, 400);
    const lines = paragraphs.flatMap((line) => wrap(ctx, line, maxWidth));
    const gap = size * leading;
    if (lines.length * gap <= maxHeight) return { size, lines, gap };
  }
  setFont(ctx, minSize, 400);
  return { size: minSize, lines: wrap(ctx, paragraphs.join(" "), maxWidth), gap: minSize * leading };
}

function drawEtiquette(ctx, chinese, english) {
  if (!chinese.length && !english.length) return;
  const blocks = [];
  if (chinese.length) {
    blocks.push({
      spacing: 79,
      ...fitReminder(ctx, chinese, { maxWidth: 1480, maxHeight: 230, startSize: 56, minSize: 32, wrap: wrapText })
    });
  }
  if (english.length) {
    blocks.push({
      spacing: chinese.length ? 61 : 75,
      ...fitReminder(ctx, english, { maxWidth: 1360, maxHeight: 146, startSize: 34, minSize: 20, wrap: wrapEnglish })
    });
  }
  const span = blocks.reduce((sum, block) => sum + block.spacing + (block.lines.length - 1) * block.gap, 0);
  let y = 632 - span / 2;

  ctx.textAlign = "center";
  lettering(ctx, reminderHeading, width / 2, y, 62, 700);
  for (const block of blocks) {
    y += block.spacing;
    block.lines.forEach((line, index) => lettering(ctx, line, width / 2, y + index * block.gap, block.size));
    y += (block.lines.length - 1) * block.gap;
  }
}

function drawClubMarks(ctx) {
  const qrSize = 192;
  const right = width - 76;
  const bottom = height - 52;
  const qrLeft = right - qrSize;
  if (clubLogo) {
    const mask = tintedLogo.getContext("2d");
    mask.clearRect(0, 0, tintedLogo.width, tintedLogo.height);
    mask.fillStyle = clubColor.value;
    mask.fillRect(0, 0, tintedLogo.width, tintedLogo.height);
    mask.save();
    mask.globalCompositeOperation = "destination-in";
    mask.drawImage(clubLogo, 0, 0);
    mask.restore();

    const logoWidth = 216;
    const logoHeight = logoWidth * tintedLogo.height / tintedLogo.width;
    const logoRight = clubQr ? qrLeft - 25 : right;
    ctx.drawImage(tintedLogo, logoRight - logoWidth, bottom - (qrSize + logoHeight) / 2, logoWidth, logoHeight);
  }
  if (clubQr) ctx.drawImage(clubQr, qrLeft, bottom - qrSize, qrSize, qrSize);
}

function readParagraphs(input) {
  return input.value.split("\n").map((line) => line.trim()).filter(Boolean);
}

function drawCard(target) {
  const title = titleInput.value.trim();
  const director = directorInput.value.trim();
  const chinese = readParagraphs(reminderInput);
  const english = readParagraphs(englishInput);
  const ctx = target.getContext("2d");
  const scale = target.width / width;
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.imageSmoothingQuality = "high";
  drawStill(ctx, selectedImage || sampleImage);
  ctx.save();
  ctx.textBaseline = "middle";
  ctx.shadowColor = "rgba(0, 0, 0, .92)";
  ctx.shadowBlur = 13 * scale;
  ctx.shadowOffsetY = 2 * scale;
  ctx.fillStyle = filmColor.value;
  drawFilmInfo(ctx, title, director);
  ctx.fillStyle = reminderColor.value;
  drawEtiquette(ctx, chinese, english);
  ctx.restore();
  drawClubMarks(ctx);

  const description = [title, director && "导演 " + director, ...chinese, ...english];
  if (clubLogo || clubQr) description.push(clubQr ? "800号电影社微信公众号二维码" : "800号电影社标识");
  target.setAttribute("aria-label", ["放映提示卡", ...description.filter(Boolean)].join("。"));
}

function updatePreview() {
  drawCard(card);
  if (dialog.open) drawCard(get("large-card"));
  get("light-value").value = lightInput.value + "%";
  get("status").textContent = "";
}

function reportImageError(message = "") {
  const error = get("image-error");
  error.textContent = message;
  error.hidden = !message;
}

function loadImage(url) {
  return new Promise((resolve, reject) => {
    const source = new Image();
    source.onload = () => resolve(source);
    source.onerror = reject;
    source.src = url;
  });
}

async function chooseImage(file) {
  if (!file) return;
  const request = ++fileRequest;
  reportImageError();
  if (!/\.(?:jpe?g|png|webp)$/i.test(file.name) && !/^image\/(?:jpeg|png|webp)$/i.test(file.type)) {
    reportImageError("请选择 JPG、PNG 或 WebP 图片。");
    return;
  }

  const url = URL.createObjectURL(file);
  try {
    const source = await loadImage(url);
    if (request !== fileRequest) return;
    selectedImage = source;
    const caption = get("file-caption");
    caption.textContent = file.name;
    caption.title = file.name;
    get("preview-label").textContent = "已载入剧照";
    updatePreview();
  } catch {
    if (request === fileRequest) reportImageError("这张图片无法读取，请试试另一张。");
  } finally {
    URL.revokeObjectURL(url);
  }
}

function exportName() {
  const title = titleInput.value.trim().replace(/[<>:"/\\|?*\u0000-\u001f]/g, " ").trim();
  return title ? title + " · 映前提示.png" : "映前提示.png";
}

function exportCard() {
  const scale = Number(resolutionInput.value);
  const output = document.createElement("canvas");
  output.width = width * scale;
  output.height = height * scale;
  const name = exportName();
  const status = get("status");
  downloadButton.disabled = true;
  status.textContent = "正在生成图片…";
  drawCard(output);
  output.toBlob((blob) => {
    downloadButton.disabled = false;
    if (!blob) {
      status.textContent = "图片生成失败，请重试。";
      return;
    }
    const fileUrl = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = fileUrl;
    link.download = name;
    document.body.append(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(fileUrl), 15000);
    status.textContent = "已生成 " + output.width + " × " + output.height + " PNG";
  }, "image/png");
}

for (const input of [titleInput, directorInput, lightInput, reminderInput, englishInput]) {
  input.addEventListener("input", updatePreview);
}
get("restore-rules").addEventListener("click", () => {

for (const row of document.querySelectorAll(".color-row")) {
  const picker = row.querySelector('input[type="color"]');
  const presets = row.querySelectorAll("button[data-color]");
  const changeColor = () => {
    for (const button of presets) {
      button.setAttribute("aria-pressed", String(button.dataset.color === picker.value));
    }
    updatePreview();
  };
  picker.addEventListener("input", changeColor);
  picker.addEventListener("change", changeColor);
  for (const button of presets) {
    button.addEventListener("click", () => {
      picker.value = button.dataset.color;
      changeColor();
    });
  }
}
dropZone.addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", () => {

dropZone.addEventListener("dragover", (event) => {
  event.preventDefault();
  dropZone.classList.add("is-dragging");
});
dropZone.addEventListener("dragleave", (event) => {
  if (!dropZone.contains(event.relatedTarget)) dropZone.classList.remove("is-dragging");
});
dropZone.addEventListener("drop", (event) => {
  event.preventDefault();
  dropZone.classList.remove("is-dragging");
  chooseImage(event.dataTransfer.files[0]);
});
resolutionInput.addEventListener("change", () => {

});
